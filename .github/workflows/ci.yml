name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    # Fixo em 24.04: em 10/2026 o ubuntu-latest virou 26.04, e o Playwright 1.59
    # não instala o Chromium nele ("does not support chromium on ubuntu26.04").
    # Voltar para latest quando o Playwright do projeto suportar a versão nova.
    runs-on: ubuntu-24.04
    env:
      # Porta morta na própria máquina: nada responde e nada sai do runner. Antes era
      # https://example.supabase.co, um host EXTERNO de verdade. A guarda de destino
      # (GLYX-46, lib/testes/guarda-destino.ts) recusa qualquer host fora da máquina.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SIGNUP_INVITE_CODE: e2e-invite-gate
      # Opcional: secrets E2E_USER_EMAIL / E2E_USER_PASSWORD habilitam clinical-path.spec.ts
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
